<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>易拉宝</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="banner">
    <div class="safe">
      <header class="brand">
        <span class="logo"></span>
        <span class="brand-name">品牌名称</span>
      </header>

      <section class="hero">
        <p class="eyebrow">主标题上方的小字</p>
        <h1>主标题</h1>
        <p class="subheadline">副标题或一句补充说明。</p>
      </section>

      <section class="features">
        <div class="feature">
          <span class="index">01</span>
          <div>
            <h2>要点一</h2>
            <p>简短说明这个要点。</p>
          </div>
        </div>
        <div class="feature">
          <span class="index">02</span>
          <div>
            <h2>要点二</h2>
            <p>简短说明这个要点。</p>
          </div>
        </div>
        <div class="feature">
          <span class="index">03</span>
          <div>
            <h2>要点三</h2>
            <p>简短说明这个要点。</p>
          </div>
        </div>
      </section>

      <footer class="bottom">
        <p class="footer-line">底部短句</p>
        <div class="qr" aria-label="二维码占位"></div>
      </footer>
    </div>
  </main>
</body>
</html>
